<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect x="0" y="0" width="100" height="100" rx="20" fill="#f0ca5b" />
  <g stroke="#1a180e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer diamond shape -->
    <polygon points="25,40 50,75 75,40 60,25 40,25" />
    <!-- Horizontal line -->
    <line x1="25" y1="40" x2="75" y2="40" />
    <!-- Vertical center line -->
    <line x1="50" y1="40" x2="50" y2="75" />
    <!-- Top inner diagonals -->
    <line x1="40" y1="25" x2="45" y2="40" />
    <line x1="60" y1="25" x2="55" y2="40" />
  </g>
</svg>